[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacekid"
version = "0.1.0"
description = "A minimalist spec kit for agentic development."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
spacekid = "spacekid.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spacekid.templates" = ["*.md"]
